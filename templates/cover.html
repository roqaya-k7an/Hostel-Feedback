{% extends "base.html" %}
{% block body %}
<div class="hero">
  <div class="container">
    <nav class="hero__nav">
      <div class="brand">
        <img src="{{ url_for('static', filename='img/iiui-logo.png') }}" alt="IIUI" class="brand__logo-img">
        <span data-i18n="brand">IIUI Hostel Feedback</span>
      </div>
      <div class="lang-toggle">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="ar">عربي</button>
      </div>
    </nav>
  </div>

  <div class="hero__body">
    <div class="container">
      <div class="hero__grid">
        <div>
          <span class="hero__eyebrow" data-i18n="cover_eyebrow">Smart Housing Feedback &amp; Quality Control</span>
          <h1>
            <span data-i18n="cover_title_1">Your Voice Shapes</span><br>
            <span class="accent" data-i18n="cover_title_2">Student Living</span>
          </h1>
          <p class="hero__sub" data-i18n="cover_sub">Help us improve your hostel experience.</p>
          <div class="hero__cta">
            <a href="{{ url_for('role_select') }}" class="btn btn--gold btn--lg" data-i18n="getStarted">Get Started</a>
          </div>
          <div class="hero__note">
            <span>&#128274; <em data-i18n="cover_note_1">Private &amp; secure</em></span>
            <span>&#9989; <em data-i18n="cover_note_2">One response per student</em></span>
            <span>&#9201;&#65039; <em data-i18n="cover_note_3">Takes ~3 minutes</em></span>
          </div>
        </div>

        <div class="hero__art hero__art--photo">
          <img src="{{ url_for('static', filename='img/dorm1.jpg') }}" alt="IIUI Hostel" class="hero__photo">
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
